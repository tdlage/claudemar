services:
  bifrost:
    image: maximhq/bifrost
    container_name: claudemar-bifrost
    restart: unless-stopped
    # Gateway de LLM: expõe um endpoint Anthropic-compatible (/anthropic) e roteia para o
    # provedor escolhido pelo nome do modelo (provider/modelo). As chaves dos upstreams
    # (OPENAI_API_KEY, ZAI_API_KEY, SAKANA_API_KEY, BIFROST_ANTHROPIC_API_KEY) vêm do .env.
    # NOTA: o header `anthropic-beta` que o Claude Code envia é bloqueado por padrão.
    # Libere-o uma única vez na UI do Bifrost (http://localhost:8080) em
    # Settings -> Client Settings -> AllowList, adicionando `anthropic-beta`.
    env_file: .env
    volumes:
      - ./docker/bifrost/config.json:/app/data/config.json:ro
      - bifrost_data:/app/data
    ports:
      - "8080:8080"

  claudemar:
    build: .
    container_name: claudemar
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data/orchestrator:/app/orchestrator
      - ./data/agents:/app/agents
      - ./data/projects:/app/projects
      - ./data/data:/app/data
    env_file: .env
    environment:
      - DASHBOARD_PORT=3000
      - CLAUDEMAR_DATA=/app
      - MYSQL_HOST=mysql
      - GATEWAY_URL=http://bifrost:8080/anthropic
      - REDIS_URL=redis://redis:6379
      - WHATSAPP_BRIDGE_URL=http://whatsapp-bridge:3000
    depends_on:
      mysql:
        condition: service_healthy
      bifrost:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: claudemar-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: claudemar
      MYSQL_USER: claudemar
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-claudemar_secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  whatsapp-bridge:
    image: aldinokemal2104/go-whatsapp-web-multidevice:latest
    container_name: claudemar-whatsapp
    restart: unless-stopped
    # Bridge não-oficial (whatsmeow) — usar SEMPRE número secundário (risco de ban).
    # Defina WHATSAPP_BRIDGE_AUTH (usuario:senha) no .env: sem isso a API REST do bridge
    # fica sem autenticação para quem alcançar a porta 3010 no host.
    environment:
      - APP_PORT=3000
      - APP_BASIC_AUTH=${WHATSAPP_BRIDGE_AUTH:-}
      - WHATSAPP_WEBHOOK=${WHATSAPP_BRIDGE_WEBHOOK:-http://host.docker.internal:${DASHBOARD_PORT:-3000}/api/brain/whatsapp/webhook}
      - WHATSAPP_WEBHOOK_SECRET=${BRAIN_WHATSAPP_WEBHOOK_SECRET:-}
      - WHATSAPP_WEBHOOK_EVENTS=message
      - WHATSAPP_AUTO_DOWNLOAD_MEDIA=false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - whatsapp_data:/app/storages
    ports:
      - "127.0.0.1:3010:3000"

  redis:
    image: redis:7-alpine
    container_name: claudemar-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  mysql_data:
  bifrost_data:
  redis_data:
  whatsapp_data:
