<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>HTML preview</title>
  </head>
  <body>
    <script>
      window.addEventListener("message", (event) => {
        if (event.source !== parent || event.origin !== location.origin) return;
        if (event.data?.type !== "html-preview" || typeof event.data.content !== "string") return;
        document.open();
        document.write(event.data.content);
        document.close();
      });
    </script>
  </body>
</html>
